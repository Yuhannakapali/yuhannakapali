backend:
  name: github
  repo: Yuhannakapali/yuhannakapali
  branch: main

media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  - name: posts
    label: Posts
    folder: content/posts
    create: true
    extension: md
    format: yaml-frontmatter
    slug: "{{slug}}"
    fields:
      - { name: title, label: Title, widget: string }
      - { name: date, label: Date, widget: datetime }
      - { name: description, label: Description, widget: text, required: false }
      - { name: cover, label: Cover, widget: image, required: false }
      - { name: body, label: Body, widget: markdown }

  - name: reviews
    label: Film reviews
    folder: content/reviews
    create: true
    extension: md
    format: yaml-frontmatter
    slug: "{{slug}}"
    fields:
      - { name: title, label: Review title, widget: string }
      - { name: film, label: Film, widget: string }
      - { name: year, label: Release year, widget: number, value_type: int }
      - {
          name: rating,
          label: Rating (1 to 5),
          widget: number,
          value_type: float,
          min: 1,
          max: 5,
          step: 0.5,
        }
      - { name: date, label: Date, widget: datetime }
      - { name: description, label: Description, widget: text, required: false }
      - { name: cover, label: Cover, widget: image, required: false }
      - { name: body, label: Body, widget: markdown }

  - name: treks
    label: Trek guides
    folder: content/treks
    create: true
    extension: md
    format: yaml-frontmatter
    slug: "{{slug}}"
    fields:
      - { name: title, label: Title, widget: string }
      - { name: region, label: Region, widget: string }
      - { name: days, label: Days, widget: number, value_type: int }
      - {
          name: difficulty,
          label: Difficulty,
          widget: select,
          options: [Easy, Moderate, Hard, Strenuous],
        }
      - {
          name: best_season,
          label: Best season,
          widget: string,
          required: false,
        }
      - {
          name: max_altitude,
          label: Max altitude (m),
          widget: number,
          value_type: int,
          required: false,
        }
      - { name: date, label: Date, widget: datetime }
      - { name: description, label: Description, widget: text, required: false }
      - { name: cover, label: Cover, widget: image, required: false }
      - { name: body, label: Body, widget: markdown }
